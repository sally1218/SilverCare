<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 銀髮族居家復健系統</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --error-bg: #fdeaea;
            --error-text: #e74c3c;
        }

        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 380px;
            transition: transform 0.3s ease;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin: 10px 0;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        /* 錯誤訊息樣式 */
        .flash-message {
            color: var(--error-text);
            background: var(--error-bg);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #f5c6cb;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            transition: 0.3s;
        }

            input:focus {
                border-color: #4facfe;
                outline: none;
                box-shadow: 0 0 8px rgba(79, 172, 254, 0.2);
            }

        .btn-submit {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
            }

        .footer-link {
            margin-top: 25px;
            font-size: 15px;
            color: #7f8c8d;
        }

            .footer-link a {
                color: #4facfe;
                text-decoration: none;
                font-weight: bold;
            }

                .footer-link a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>

    <div class="card">
        <h1>歡迎回來</h1>
        <p>請登入以開始您的復健課程</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-message">
            <span>⚠️</span> {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="input-group">
                <label>帳號名稱</label>
                <input type="text" name="username" placeholder="請輸入帳號" required>
            </div>

            <div class="input-group">
                <label>登入密碼</label>
                <input type="password" name="password" placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="btn-submit">立即登入</button>
        </form>

        <div class="footer-link">
            還沒有帳號嗎？ <a href="/register_page">點此註冊新帳號</a>
        </div>
    </div>

</body>
</html>
